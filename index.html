<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusLink</title>
    <meta name="description" content="Find verified campus tutors, book sessions, and manage mentoring in one place." />
    <meta name="theme-color" content="#0F5132" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Inlined (not in a JS bundle) so it paints immediately on the very
         first frame — before React, fonts, or any other stylesheet has had
         a chance to load. Removed by main.jsx once the real app has mounted
         and actually painted. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0F5132;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash-mark {
        width: 60px;
        height: 60px;
        /* Delayed until the drawing animation below has finished, so the
           icon isn't scaling while its lines are still mid-stroke. */
        animation: app-splash-breathe 1.8s ease-in-out 1.5s infinite;
      }
      .app-splash-mark svg {
        width: 100%;
        height: 100%;
      }
      /* Each path's stroke-dasharray is set to (approximately) its own real
         length — measured with getTotalLength() — so the dashoffset
         animation traces it fully rather than under/over-shooting. Cap
         outline draws first, the hanging tassel line next, then the base
         curve settles in last, like the mark is being sketched. */
      .app-splash-mark svg path:nth-child(1) {
        stroke-dasharray: 46;
        stroke-dashoffset: 46;
        animation: app-splash-draw 0.9s ease forwards;
      }
      .app-splash-mark svg path:nth-child(2) {
        stroke-dasharray: 6;
        stroke-dashoffset: 6;
        animation: app-splash-draw 0.35s ease 0.75s forwards;
      }
      .app-splash-mark svg path:nth-child(3) {
        stroke-dasharray: 22;
        stroke-dashoffset: 22;
        animation: app-splash-draw 0.65s ease 0.9s forwards;
      }
      @keyframes app-splash-draw {
        to { stroke-dashoffset: 0; }
      }
      .app-splash-word {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.2px;
        color: #ffffff;
        opacity: 0;
        animation: app-splash-word-in 0.6s ease 0.2s forwards;
      }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); opacity: 0.96; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes app-splash-word-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
          <path d="M22 10v6" />
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </svg>
      </div>
      <div class="app-splash-word">CampusLink</div>
    </div>
    <script>
      // Timestamped up front (not in main.jsx) so the "how long has the
      // splash actually been visible" measurement starts at the true first
      // frame, not whenever the JS bundle happens to finish loading.
      window.__splashStart = Date.now();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
