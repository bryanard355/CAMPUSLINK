<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusLink</title>
    <meta name="description" content="Find verified campus tutors, book sessions, and manage mentoring in one place." />
    <meta name="theme-color" content="#0F5132" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Inlined (not in a JS bundle) so it paints immediately on the very
         first frame — before React, fonts, or any other stylesheet has had
         a chance to load. Removed by main.jsx once the real app has mounted
         and actually painted. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0F5132;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash-mark {
        width: 60px;
        height: 60px;
        animation: app-splash-breathe 1.8s ease-in-out infinite;
      }
      .app-splash-mark svg {
        width: 100%;
        height: 100%;
      }
      .app-splash-word {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.2px;
        color: #ffffff;
      }
      .app-splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 2px;
      }
      .app-splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        animation: app-splash-bounce 1.1s ease-in-out infinite;
      }
      .app-splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .app-splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); opacity: 0.96; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes app-splash-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
          <path d="M22 10v6" />
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </svg>
      </div>
      <div class="app-splash-word">CampusLink</div>
      <div class="app-splash-dots"><span></span><span></span><span></span></div>
    </div>
    <script>
      // Timestamped up front (not in main.jsx) so the "how long has the
      // splash actually been visible" measurement starts at the true first
      // frame, not whenever the JS bundle happens to finish loading.
      window.__splashStart = Date.now();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
